# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
#
# Config ÚNICO do site (só GitHub Pages, público). O destino privado (SWA) foi
# abandonado. Gate PÚBLICO: explicit-publish LIGADO, remove-draft DESLIGADO ->
# só notas com `publish: true` sobem. É o único controle que mantém as notas
# privadas fora da web pública — NÃO enfraquecer (spec §7).
configuration:
  pageTitle: Janderson Campelo
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: pt-BR
  # Garden servido sob /vault (a raiz "/" e a landing estatica index.html deste repo,
  # copiada para dist-public/ pelo deploy.yml). Path no baseUrl -> canonical/sitemap/RSS/og
  # apontam para .../vault; links internos do Quartz sao relativos, entao funcionam no subpath.
  baseUrl: jandersoncampelo.github.io/vault
  # SEGURANCA: o Quartz copia arquivos nao-.md como assets SEM filtro de publish.
  # Denylist de pastas de tooling + extensoes de codigo/dados para nao vazar no publico.
  # (imagens/pdf continuam permitidos, pois sao linkados pelas notas)
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - .trash
    - raw
    - tools
    - scratch
    - "**/*.py"
    - "**/*.pyc"
    - "**/__pycache__/**"
    # NOTA: .base/.canvas foram REMOVIDOS daqui deliberadamente para publicar o
    # wiki/dashboard.base. Isso expoe o indice do vault e ignora o publish:true;
    # qualquer .base/.canvas novo tambem publica automaticamente.
    - "**/*.json"
    - "**/*.toml"
    - "**/*.sh"
    - "**/*.ipynb"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  # ---- Tema sanctum.yellow (@quartz-themes/core + pacote @quartz-themes/sanctum) ----
  - source: "@quartz-themes/core"
    enabled: true
    options:
      theme: sanctum.yellow
      mode: both
  # ---- Gate de publicação (PÚBLICO — único controle anti-vazamento, spec §7) ----
  - source: "@quartz-community/remove-draft"
    enabled: false
  - source: "@quartz-community/explicit-publish"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  # og-image LIGADO: sem o SWA, o site publico e pequeno (so publish:true), entao
  # gerar 1 PNG por pagina publicada e barato.
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  # canvas-page LIGADO por escolha do usuario (0 arquivos .canvas hoje; inofensivo).
  # ATENCAO: emite .canvas por fora do filtro publish -> novos .canvas publicam sozinhos.
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  # tag-page LIGADO de volta: sem o SWA, o site publico so tem notas publish:true,
  # entao poucas tag-pages (era 429MB no vault COMPLETO, nao no subset publico).
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  # graph LIGADO de volta: sem o SWA, o site publico e pequeno, entao o peso do grafo
  # por pagina (~163KB) nao e problema (poucas paginas publicadas).
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/jandersoncampelo
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  # bases-page LIGADO por escolha do usuario para publicar wiki/dashboard.base.
  # ATENCAO: renderiza a query IGNORANDO publish:true -> expoe o indice do vault.
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  # note-properties = PARSER de frontmatter do v5 (nao so a tabela visual). Precisa
  # estar LIGADO (default) senao nenhum title/publish e lido (gate quebra, tudo
  # vira "Sem titulo"). Opcoes no padrao (mostra o painel de propriedades).
  - source: "@quartz-community/note-properties"
    enabled: true
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  # encrypted-pages DESLIGADO: nao usamos senha por nota; o SWA ja faz o gate.
  - source: "@quartz-community/encrypted-pages"
    enabled: false
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
