name: Deploy vault (public + private)

on:
  workflow_dispatch: {} # botão de deploy manual na aba Actions
  push:
    branches: [main] # dispara ao mudar config/layout DESTE repo
  schedule:
    - cron: "0 */6 * * *" # rebuild a cada 6h p/ pegar mudanças no vault

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-vault
  cancel-in-progress: true

env:
  VAULT_REPO: "jandersoncampelo/the-vault" # owner/repo do vault (privado)
  # >>> AJUSTAR APÓS PROVISIONAR O SWA (B2 do runbook) <<<
  SWA_HOSTNAME: "gentle-island-020ee690f.7.azurestaticapps.net" # de: az staticwebapp show ... --query defaultHostname
  # Fixado no HEAD do v4 em 2026-07-24 p/ reprodutibilidade (spec §13). Atualizar deliberadamente.
  QUARTZ_REF: "d25a6eabf96751ffca56f8a8139272def7a65041" # branch/commit do Quartz a fixar

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Checkout site repo (Quartz config)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x" # Quartz 4.5.2+ exige Node >=22 / npm >=10.9.2

      - name: Clone Quartz
        shell: pwsh
        run: |
          # QUARTZ_REF pode ser branch, tag ou SHA de commit. --branch nao aceita SHA,
          # entao fazemos init + fetch --depth 1 do ref (GitHub permite fetch por SHA).
          git init quartz-build
          git -C quartz-build remote add origin https://github.com/jackyzha0/quartz.git
          git -C quartz-build fetch --depth 1 origin "$env:QUARTZ_REF"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao buscar o ref '$env:QUARTZ_REF' do Quartz" }
          git -C quartz-build checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Falha ao fazer checkout do ref '$env:QUARTZ_REF' do Quartz" }

      - name: Apply custom config
        shell: pwsh
        run: |
          Copy-Item quartz.config.ts quartz-build/ -Force
          if (Test-Path quartz.layout.ts) { Copy-Item quartz.layout.ts quartz-build/ -Force }

      - name: Apply theme (vendored quartz-themes/slytherin)
        shell: pwsh
        run: |
          # Tema vendorizado (congelado no git) -> injeta no clone do Quartz,
          # replicando o que o action.sh do quartz-themes faria, mas sem curl|bash.
          $stylesDir = "quartz-build/quartz/styles"
          New-Item -ItemType Directory -Force "$stylesDir/themes" | Out-Null
          Copy-Item themes/slytherin/_index.scss "$stylesDir/themes/_index.scss" -Force
          # custom.scss e conhecido (Quartz fixado no SHA); reescreve deterministicamente
          # garantindo a ordem correta dos @use.
          Set-Content "$stylesDir/custom.scss" '@use "./base.scss";'
          Add-Content "$stylesDir/custom.scss" '@use "./themes";'

      - name: Clone vault into content/
        shell: pwsh
        env:
          VAULT_REPO_PAT: ${{ secrets.VAULT_REPO_PAT }}
        run: |
          Remove-Item -Recurse -Force quartz-build/content -ErrorAction SilentlyContinue
          git clone --depth 1 "https://x-access-token:$env:VAULT_REPO_PAT@github.com/$env:VAULT_REPO.git" quartz-build/content
          if ($LASTEXITCODE -ne 0) { throw "Falha ao clonar o vault ($env:VAULT_REPO) - verifique o secret VAULT_REPO_PAT (acesso Contents:Read ao repo)" }
          Remove-Item -Recurse -Force quartz-build/content/.git

      - name: Install dependencies
        working-directory: quartz-build
        shell: pwsh
        run: npm ci

      - name: Build PUBLIC subset (publish:true only)
        working-directory: quartz-build
        shell: pwsh
        env:
          QUARTZ_PUBLIC: "true"
          QUARTZ_BASE_URL: "jandersoncampelo.github.io"
        run: npx quartz build --output "$env:GITHUB_WORKSPACE/dist-public"

      - name: Build PRIVATE full vault
        working-directory: quartz-build
        shell: pwsh
        env:
          QUARTZ_PUBLIC: "false"
          QUARTZ_BASE_URL: ${{ env.SWA_HOSTNAME }}
        run: |
          npx quartz build --output "$env:GITHUB_WORKSPACE/dist-private"
          Copy-Item "$env:GITHUB_WORKSPACE/staticwebapp.config.json" "$env:GITHUB_WORKSPACE/dist-private/" -Force

      # ---- Deploy público -> GitHub Pages ----
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-public
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # ---- Deploy privado -> Azure Static Web Apps ----
      - name: Deploy to Azure SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          action: upload
          app_location: dist-private
          output_location: ""
          skip_app_build: true
