name: Deploy vault (public + private)

on:
  workflow_dispatch: {} # botão de deploy manual na aba Actions
  push:
    branches: [main] # dispara ao mudar config/layout DESTE repo
  schedule:
    - cron: "0 */6 * * *" # rebuild a cada 6h p/ pegar mudanças no vault

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-vault
  cancel-in-progress: true

env:
  VAULT_REPO: "jandersoncampelo/the-vault" # owner/repo do vault (privado)
  # Quartz 5.0.0 (commit da tag). baseUrl de cada destino vive no proprio YAML.
  QUARTZ_REF: "ab346fa66a895e12d63a308e70ce330ba795822a" # branch/commit do Quartz a fixar

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Checkout site repo (Quartz config)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x" # Quartz 4.5.2+ exige Node >=22 / npm >=10.9.2

      - name: Clone Quartz
        shell: pwsh
        run: |
          # QUARTZ_REF pode ser branch, tag ou SHA de commit. --branch nao aceita SHA,
          # entao fazemos init + fetch --depth 1 do ref (GitHub permite fetch por SHA).
          git init quartz-build
          git -C quartz-build remote add origin https://github.com/jackyzha0/quartz.git
          git -C quartz-build fetch --depth 1 origin "$env:QUARTZ_REF"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao buscar o ref '$env:QUARTZ_REF' do Quartz" }
          git -C quartz-build checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Falha ao fazer checkout do ref '$env:QUARTZ_REF' do Quartz" }

      - name: Clone vault into content/
        shell: pwsh
        env:
          VAULT_REPO_PAT: ${{ secrets.VAULT_REPO_PAT }}
        run: |
          Remove-Item -Recurse -Force quartz-build/content -ErrorAction SilentlyContinue
          git clone --depth 1 "https://x-access-token:$env:VAULT_REPO_PAT@github.com/$env:VAULT_REPO.git" quartz-build/content
          if ($LASTEXITCODE -ne 0) { throw "Falha ao clonar o vault ($env:VAULT_REPO) - verifique o secret VAULT_REPO_PAT (acesso Contents:Read ao repo)" }
          Remove-Item -Recurse -Force quartz-build/content/.git

      - name: Install dependencies
        working-directory: quartz-build
        shell: pwsh
        run: npm ci

      # ---- Build PUBLICO -> GitHub Pages (so notas publish:true) ----
      # v5: o config vive em quartz.config.yaml no cwd. Copiamos o YAML publico e,
      # ANTES de buildar, um guard aborta se o gate nao for o esperado (spec §7).
      - name: Build PUBLIC subset (publish:true only)
        working-directory: quartz-build
        shell: pwsh
        run: |
          Copy-Item "$env:GITHUB_WORKSPACE/quartz.config.public.yaml" "quartz.config.yaml" -Force
          $cfg = Get-Content "quartz.config.yaml"
          function Gate($lines, $src) { for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -like "*$src*") { return ($lines[$i + 1] -match "enabled:\s*true") } } return $null }
          $ep = Gate $cfg '@quartz-community/explicit-publish'
          $rd = Gate $cfg '@quartz-community/remove-draft'
          if (-not ($ep -eq $true -and $rd -eq $false)) { throw "GATE PUBLICO INVALIDO: explicit-publish=$ep remove-draft=$rd (esperado true/false)" }
          Write-Host "Gate publico OK: explicit-publish=true, remove-draft=false"
          npx quartz build --output "$env:GITHUB_WORKSPACE/dist-public"

      # ---- Build PRIVADO -> Azure SWA (vault completo, menos draft:true) ----
      - name: Build PRIVATE full vault
        working-directory: quartz-build
        shell: pwsh
        run: |
          Copy-Item "$env:GITHUB_WORKSPACE/quartz.config.yaml" "quartz.config.yaml" -Force
          $cfg = Get-Content "quartz.config.yaml"
          function Gate($lines, $src) { for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -like "*$src*") { return ($lines[$i + 1] -match "enabled:\s*true") } } return $null }
          $rd = Gate $cfg '@quartz-community/remove-draft'
          $ep = Gate $cfg '@quartz-community/explicit-publish'
          if (-not ($rd -eq $true -and $ep -eq $false)) { throw "GATE PRIVADO INVALIDO: remove-draft=$rd explicit-publish=$ep (esperado true/false)" }
          Write-Host "Gate privado OK: remove-draft=true, explicit-publish=false"
          npx quartz build --output "$env:GITHUB_WORKSPACE/dist-private"
          Copy-Item "$env:GITHUB_WORKSPACE/staticwebapp.config.json" "$env:GITHUB_WORKSPACE/dist-private/" -Force

      # ---- Deploy público -> GitHub Pages ----
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-public
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # ---- Deploy privado -> Azure Static Web Apps ----
      - name: Deploy to Azure SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          action: upload
          app_location: dist-private
          output_location: ""
          skip_app_build: true
